<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Urbakasa — Mi pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F3EEE2;--ink:#1E3A34;--ink-soft:#3E5850;--line:#C9C2AE;--paper-card:#FAF7EF;--moss:#3F6B44;--moss-soft:#DCE8D8;--brass:#8A5A22;--brass-soft:#E9DAC1;--rust:#9C3E28;--rust-soft:#F2DCD3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;}
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 60px;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 2px;}
  .who{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin:0;}
  button.logout{background:none;border:1px solid var(--line);padding:7px 14px;border-radius:3px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:3px;padding:16px 18px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  h3{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 12px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:14px;color:var(--ink);font-family:'Public Sans',sans-serif;}
  textarea{resize:vertical;min-height:50px;}
  button.action{margin-top:14px;background:var(--ink);color:var(--paper-card);border:none;padding:9px 16px;border-radius:3px;font-size:13px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:6px 4px;}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  .empty{color:var(--ink-soft);font-size:13px;font-style:italic;padding:10px 0;}
  .stat-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;margin:0;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;}
  .comentario-txt{font-size:11.5px;color:var(--ink-soft);white-space:normal;word-break:break-word;display:block;}
  .table-scroll{overflow-x:auto;}
  .sort-controls{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .sort-controls select{width:auto;font-size:12px;padding:5px 8px;}
  .sort-dir-btn{background:none;border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .hist-badge{font-size:10px;color:var(--rust);cursor:pointer;text-decoration:underline;white-space:nowrap;}
  .pipeline-table{table-layout:fixed;}
  .pipeline-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pipeline-table td.coment-cell{white-space:normal;overflow:visible;text-overflow:clip;}
  .edit-link{background:none;border:none;color:var(--ink-soft);font-size:10.5px;text-decoration:underline;cursor:pointer;padding:2px 0 0;display:block;}
  .coment-edit-box textarea{width:100%;min-height:55px;font-size:12px;}
  .coment-edit-box button{margin-top:4px;font-size:11px;padding:3px 9px;background:var(--ink);color:#fff;border:none;border-radius:3px;cursor:pointer;}
  .aviso-item{border-bottom:1px solid var(--line);padding:10px 0;}
  .aviso-item:last-child{border-bottom:none;}
  .aviso-fecha{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <p class="eyebrow">Urbakasa</p>
      <h1>Mi pipeline</h1>
      <p class="who" id="who-am-i"></p>
    </div>
    <button class="logout" onclick="logout()">Cerrar sesión</button>
  </div>

  <div class="grid2">
    <div class="card">
      <p class="stat-label">Prospectos registrados</p>
      <p class="stat-val" id="stat-total">0</p>
    </div>
    <div class="card">
      <p class="stat-label">Ingreso generado (cerrados)</p>
      <p class="stat-val" id="stat-ingreso">$0</p>
    </div>
  </div>

  <div class="card">
    <h3>Avisos de tu administrador</h3>
    <div id="avisos-body"></div>
    <p class="empty" id="avisos-empty" style="display:none;">No hay avisos por ahora.</p>
  </div>

  <div class="card">
    <h3>Nuevo prospecto</h3>
    <label>Nombre</label>
    <input id="c-nombre" placeholder="Empresa o propietario">
    <label>Teléfono</label>
    <input id="c-telefono" placeholder="33 1234 5678">
    <label>Tipo</label>
    <select id="c-tipo"><option>Propietario</option><option>Corredor independiente</option><option>Asesor Inmobiliario</option><option>Directivo Inmobiliaria</option></select>
    <label>Estado</label>
    <select id="c-estado">
      <option value="contacto">Contacto</option>
      <option value="seguimiento">Seguimiento</option>
      <option value="venta">Venta</option>
      <option value="fuera">Fuera</option>
    </select>
    <label>Fecha tentativa de cierre</label>
    <input id="c-fecha-cierre" type="date">
    <label>Monto generado (si cerró)</label>
    <input id="c-monto" type="number" placeholder="opcional">
    <label>Comentarios</label>
    <textarea id="c-comentarios" placeholder="notas sobre este contacto"></textarea>
    <button class="action" onclick="addContact()">Agregar</button>
  </div>

  <div class="card">
    <h3>Mis prospectos</h3>
    <div class="sort-controls">
      <label style="margin:0;">Ordenar por</label>
      <select id="sort-field-pipeline" onchange="renderContactsTable()">
        <option value="fecha">Fecha de registro</option>
        <option value="nombre">Nombre</option>
        <option value="fecha_cierre_tentativa">Fecha de cierre tentativa</option>
        <option value="tipo">Tipo (propietario/asesor)</option>
        <option value="estado">Estado</option>
      </select>
      <button class="sort-dir-btn" onclick="toggleSortDir()" id="sort-dir-pipeline">↓ desc</button>
      <label style="margin:0;">luego por</label>
      <select id="sort-field-pipeline-2" onchange="renderContactsTable()">
        <option value="">(sin segundo criterio)</option>
        <option value="fecha">Fecha de registro</option>
        <option value="nombre">Nombre</option>
        <option value="fecha_cierre_tentativa">Fecha de cierre tentativa</option>
        <option value="tipo">Tipo (propietario/asesor)</option>
        <option value="estado">Estado</option>
      </select>
    </div>
    <div class="table-scroll">
    <table class="pipeline-table">
      <colgroup>
        <col style="width:90px"><col style="width:140px"><col style="width:105px"><col style="width:130px"><col style="width:115px"><col style="width:140px"><col style="width:90px"><col style="width:230px">
      </colgroup>
      <thead><tr><th>Fecha</th><th>Nombre</th><th>Tel.</th><th>Tipo</th><th>Estado</th><th>Cierre tent.</th><th>Monto</th><th>Comentarios</th></tr></thead>
      <tbody id="contacts-body"></tbody>
    </table>
    </div>
    <p class="empty" id="contacts-empty" style="display:none;">Aún no has registrado prospectos.</p>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let userId = null;
let misContactos = [];

async function init(){
  const { data } = await client.auth.getSession();
  if(!data.session){ window.location.href = 'login.html'; return; }
  const { data: perfil } = await client.from('perfiles').select('rol,nombre').eq('id', data.session.user.id).single();
  if(!perfil || perfil.rol !== 'embajador'){ window.location.href = 'login.html'; return; }
  userId = data.session.user.id;
  document.getElementById('who-am-i').textContent = perfil.nombre || data.session.user.email;
  await Promise.all([loadContacts(), loadAvisos()]);
}

async function logout(){
  await client.auth.signOut();
  window.location.href = 'login.html';
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return '$'+Math.round(n).toLocaleString('es-MX'); }

async function addContact(){
  const nombre = document.getElementById('c-nombre').value.trim();
  if(!nombre) return;
  const montoVal = document.getElementById('c-monto').value;
  const comentarioInicial = document.getElementById('c-comentarios').value.trim();
  const { error } = await client.from('prospectos').insert({
    created_by: userId,
    nombre,
    telefono: document.getElementById('c-telefono').value.trim(),
    tipo: document.getElementById('c-tipo').value,
    canal: 'embajador',
    estado: document.getElementById('c-estado').value,
    fecha: todayISO(),
    fecha_cierre_tentativa: document.getElementById('c-fecha-cierre').value || null,
    monto: montoVal ? parseFloat(montoVal) : null,
    comentarios_log: comentarioInicial ? [{ texto: comentarioInicial, fecha: todayISO() }] : []
  });
  if(error){ alert('No se pudo guardar: ' + error.message); return; }
  ['c-nombre','c-telefono','c-monto','c-comentarios'].forEach(id=>document.getElementById(id).value='');
  loadContacts();
}

async function loadContacts(){
  const { data, error } = await client
    .from('prospectos')
    .select('*')
    .eq('created_by', userId)
    .order('fecha', { ascending: false });
  if(error) return;
  misContactos = data;
  document.getElementById('stat-total').textContent = data.length;
  const ingreso = data.filter(c=>c.estado==='venta').reduce((s,c)=>s+Number(c.monto||0),0);
  document.getElementById('stat-ingreso').textContent = fmt(ingreso);
  renderContactsTable();
}

let sortDirPipeline = 'desc';

function toggleSortDir(){
  sortDirPipeline = sortDirPipeline==='desc' ? 'asc' : 'desc';
  document.getElementById('sort-dir-pipeline').textContent = (sortDirPipeline==='desc' ? '↓ desc' : '↑ asc');
  renderContactsTable();
}

function sortBy(list, field, dir, field2){
  return [...list].sort((a,b)=>{
    let av = a[field], bv = b[field];
    if(av===null||av===undefined) av='';
    if(bv===null||bv===undefined) bv='';
    if(typeof av === 'string') av = av.toLowerCase();
    if(typeof bv === 'string') bv = bv.toLowerCase();
    if(av<bv) return dir==='asc' ? -1 : 1;
    if(av>bv) return dir==='asc' ? 1 : -1;
    if(field2){
      let av2 = a[field2], bv2 = b[field2];
      if(av2===null||av2===undefined) av2='';
      if(bv2===null||bv2===undefined) bv2='';
      if(typeof av2 === 'string') av2 = av2.toLowerCase();
      if(typeof bv2 === 'string') bv2 = bv2.toLowerCase();
      if(av2<bv2) return dir==='asc' ? -1 : 1;
      if(av2>bv2) return dir==='asc' ? 1 : -1;
    }
    return 0;
  });
}

function renderContactsTable(){
  const body = document.getElementById('contacts-body');
  const empty = document.getElementById('contacts-empty');
  body.innerHTML = '';
  if(misContactos.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  const field = document.getElementById('sort-field-pipeline').value;
  const field2 = document.getElementById('sort-field-pipeline-2').value;
  const sorted = sortBy(misContactos, field, sortDirPipeline, field2);
  sorted.forEach(c=>{
    const tr = document.createElement('tr');
    const hist = c.historial_cierre || [];
    const cierreTxt = (c.fecha_cierre_tentativa||'—') + (hist.length>0 ? ' <span class="hist-badge" onclick="verHistorialCierre(\''+c.id+'\')" title="ver historial">(pospuesto '+hist.length+'×)</span>' : '');
    tr.innerHTML = '<td>'+c.fecha+'</td><td>'+c.nombre+'</td><td>'+(c.telefono||'—')+'</td>'+
      '<td class="coment-cell" id="tipo-cell-'+c.id+'">'+(c.tipo||'—')+'<button class="edit-link" onclick="startEditTipo(\''+c.id+'\')">editar</button></td>'+
      '<td><select onchange="updateEstado(\''+c.id+'\', this.value)" style="width:auto;padding:3px 6px;font-size:12px;">'+
      ['contacto','seguimiento','venta','fuera'].map(s=>'<option value="'+s+'"'+(s===c.estado?' selected':'')+'>'+s+'</option>').join('')+
      '</select></td>'+
      '<td class="coment-cell" id="cierre-cell-'+c.id+'">'+cierreTxt+'<button class="edit-link" onclick="startEditCierre(\''+c.id+'\')">editar</button></td>'+
      '<td>'+(c.monto?fmt(c.monto):'—')+'</td>'+
      '<td class="coment-cell" id="coment-cell-'+c.id+'">'+renderBitacoraResumen(c)+'<button class="edit-link" onclick="startAddComentario(\''+c.id+'\')">agregar comentario</button></td>';
    body.appendChild(tr);
  });
}

function renderBitacoraResumen(c){
  const log = c.comentarios_log || [];
  if(log.length===0) return '<span class="comentario-txt">—</span>';
  const ultimo = log[log.length-1];
  const verMas = log.length>1 ? ' <span class="hist-badge" onclick="verBitacora(\''+c.id+'\')">(ver '+log.length+' notas)</span>' : '';
  return '<span class="comentario-txt">'+ultimo.fecha+': '+ultimo.texto+verMas+'</span>';
}

function verBitacora(id){
  const c = misContactos.find(x=>x.id===id);
  const log = c.comentarios_log || [];
  const lines = log.map((l,i)=>(i+1)+'. ['+l.fecha+'] '+l.texto).join('\n');
  alert('Bitácora de "'+c.nombre+'":\n\n'+lines);
}

function startAddComentario(id){
  const cell = document.getElementById('coment-cell-'+id);
  cell.innerHTML = '<div class="coment-edit-box"><textarea id="coment-new-'+id+'" placeholder="nueva nota de seguimiento"></textarea>'+
    '<button onclick="saveComentarioLog(\''+id+'\')">Agregar</button></div>';
}

async function saveComentarioLog(id){
  const texto = document.getElementById('coment-new-'+id).value.trim();
  if(!texto) return;
  const c = misContactos.find(x=>x.id===id);
  const log = c.comentarios_log || [];
  log.push({ texto, fecha: todayISO() });
  await client.from('prospectos').update({ comentarios_log: log }).eq('id', id).eq('created_by', userId);
  loadContacts();
}

function startEditTipo(id){
  const c = misContactos.find(x=>x.id===id);
  const cell = document.getElementById('tipo-cell-'+id);
  cell.innerHTML = '<div class="coment-edit-box"><select id="tipo-edit-'+id+'">'+
    ['Propietario','Corredor independiente','Asesor Inmobiliario','Directivo Inmobiliaria'].map(t=>'<option'+(t===c.tipo?' selected':'')+'>'+t+'</option>').join('')+
    '</select><button onclick="saveTipo(\''+id+'\')">Guardar</button></div>';
}

async function saveTipo(id){
  const val = document.getElementById('tipo-edit-'+id).value;
  await client.from('prospectos').update({ tipo: val }).eq('id', id).eq('created_by', userId);
  loadContacts();
}

function startEditCierre(id){
  const c = misContactos.find(x=>x.id===id);
  const cell = document.getElementById('cierre-cell-'+id);
  cell.innerHTML = '<div class="coment-edit-box"><input type="date" id="cierre-edit-'+id+'" value="'+(c.fecha_cierre_tentativa||'')+'">'+
    '<button onclick="saveCierre(\''+id+'\')">Guardar</button></div>';
}

async function saveCierre(id){
  const c = misContactos.find(x=>x.id===id);
  const nuevaFecha = document.getElementById('cierre-edit-'+id).value;
  const hist = c.historial_cierre || [];
  if(c.fecha_cierre_tentativa && c.fecha_cierre_tentativa !== nuevaFecha){
    hist.push({ anterior: c.fecha_cierre_tentativa, cambiado_en: todayISO() });
  }
  await client.from('prospectos').update({ fecha_cierre_tentativa: nuevaFecha || null, historial_cierre: hist }).eq('id', id).eq('created_by', userId);
  loadContacts();
}

function verHistorialCierre(id){
  const c = misContactos.find(x=>x.id===id);
  const hist = c.historial_cierre || [];
  const lines = hist.map((h,i)=>(i+1)+'. '+h.anterior+' → cambiada el '+h.cambiado_en).join('\n');
  alert('Historial de fechas pospuestas para "'+c.nombre+'":\n\n'+lines+'\n\nFecha actual: '+(c.fecha_cierre_tentativa||'sin definir'));
}

async function updateEstado(id, estado){
  await client.from('prospectos').update({ estado }).eq('id', id).eq('created_by', userId);
  loadContacts();
}

function startEditComentario(id){
  const c = misContactos.find(x=>x.id===id);
  const cell = document.getElementById('coment-cell-'+id);
  cell.innerHTML = '<div class="coment-edit-box"><textarea id="coment-edit-'+id+'">'+(c.comentarios||'')+'</textarea>'+
    '<button onclick="saveComentario(\''+id+'\')">Guardar</button></div>';
}

async function saveComentario(id){
  const val = document.getElementById('coment-edit-'+id).value;
  await client.from('prospectos').update({ comentarios: val }).eq('id', id).eq('created_by', userId);
  loadContacts();
}

async function loadAvisos(){
  const { data, error } = await client.from('avisos').select('*').order('created_at', { ascending: false });
  const body = document.getElementById('avisos-body');
  const empty = document.getElementById('avisos-empty');
  body.innerHTML = '';
  if(error || !data || data.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  data.forEach(a=>{
    const div = document.createElement('div');
    div.className = 'aviso-item';
    div.innerHTML = '<p class="aviso-fecha">'+new Date(a.created_at).toLocaleString('es-MX')+'</p><p style="margin:4px 0;">'+a.mensaje+'</p>';
    body.appendChild(div);
  });
}

init();
</script>
</body>
</html>
